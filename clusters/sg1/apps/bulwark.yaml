# $schema: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bulwark
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./apps/bulwark
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
