# $schema: https://github.com/yannh/kubernetes-json-schema/raw/refs/heads/master/master/statefulset.json
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stalwart
  labels:
    app.kubernetes.io/name: stalwart
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: stalwart
  serviceName: stalwart-headless
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart
    spec:
      containers:
        - name: stalwart
          image: stalwartlabs/stalwart:v1.1.1
          args:
            - "--config"
            - "/etc/stalwart/config.json"
          env:
            - name: STALWART_RECOVERY_MODE
              value: "false"
            - name: STALWART_RECOVERY_MODE_PORT
              value: "8080"
          envFrom:
            - secretRef:
                name: stalwart-env
          ports:
            - name: smtp
              containerPort: 25
            - name: smtps
              containerPort: 465
            - name: submission
              containerPort: 587
            - name: imaps
              containerPort: 993
            - name: sieve
              containerPort: 4190
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
            - name: mgmt
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/stalwart/config.json
              subPath: config.json
              readOnly: true
            - name: secret
              mountPath: /etc/secret
              readOnly: true
            - name: tls
              mountPath: /etc/tls
              readOnly: true
            - name: data
              mountPath: /var/lib/stalwart
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: mgmt
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: mgmt
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
      volumes:
        - name: config
          configMap:
            name: stalwart-config
        - name: secret
          secret:
            secretName: stalwart-secret
            defaultMode: 0440
        - name: tls
          secret:
            secretName: stalwart-tls
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
