# yaml-language-server: $schema=https://www.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stalwart
resources:
  - namespace.yaml
  - statefulset.yaml
  - service.yaml
  - ingress.yaml
  - certificate.yaml
configMapGenerator:
  - name: stalwart-config
    files:
      - config/config.json
