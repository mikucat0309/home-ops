# $schema: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: stalwart
  labels:
    app.kubernetes.io/name: stalwart
spec:
  secretName: stalwart-tls
  dnsNames:
    - mail.mikucat.me
    - mta-sts.mikucat.me
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-production
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
