# $schema: https://github.com/yannh/kubernetes-json-schema/raw/refs/heads/master/master/service.json
apiVersion: v1
kind: Service
metadata:
  name: stalwart-headless
  labels:
    app.kubernetes.io/name: stalwart
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: stalwart
  ports:
    - name: mgmt
      port: 8080
      targetPort: mgmt
---
# $schema: https://github.com/yannh/kubernetes-json-schema/raw/refs/heads/master/master/service.json
apiVersion: v1
kind: Service
metadata:
  name: stalwart
  labels:
    app.kubernetes.io/name: stalwart
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: stalwart
  ports:
    - name: http
      port: 80
      targetPort: http
---
# $schema: https://github.com/yannh/kubernetes-json-schema/raw/refs/heads/master/master/service.json
apiVersion: v1
kind: Service
metadata:
  name: stalwart-mail
  labels:
    app.kubernetes.io/name: stalwart
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: stalwart
  ports:
    - name: smtp
      port: 25
      targetPort: smtp
    - name: smtps
      port: 465
      targetPort: smtps
    - name: submission
      port: 587
      targetPort: submission
    - name: imaps
      port: 993
      targetPort: imaps
    - name: sieve
      port: 4190
      targetPort: sieve
