# $schema: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bulwark
  labels:
    app.kubernetes.io/name: bulwark
spec:
  secretName: bulwark-tls
  dnsNames:
    - webmail.mikucat.me
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-production
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
